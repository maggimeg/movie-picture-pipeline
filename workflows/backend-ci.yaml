name: Backend Continuous Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: backend-npm-${{ runner.os }}-${{ hashFiles('backend/package.json') }}
          restore-keys: backend-npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install
      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: backend-npm-${{ runner.os }}-${{ hashFiles('backend/package.json') }}
          restore-keys: backend-npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: backend-npm-${{ runner.os }}-${{ hashFiles('backend/package.json') }}
          restore-keys: backend-npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm run test
      - name: Build Docker image
        run: docker build -t movie-backend:ci .
